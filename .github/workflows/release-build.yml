name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Zip
        run: |
          cd frontend
          zip -r "../AIDE_Front_${TAG#v}.zip" build

      - name: Upload sur la release
        run: gh release upload "$TAG" "AIDE_Front_${TAG#v}.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
