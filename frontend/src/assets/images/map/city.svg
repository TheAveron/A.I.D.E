<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img">
  <title>Bannière de faction</title>
  <!-- Base BLANCHE : OpenLayers la teint avec la couleur de la faction (option `color` de Icon).
       Le contour et les ombres sont noirs : ils restent noirs une fois teintés. -->
  <g fill="#fff" stroke="#000" stroke-opacity="0.85" stroke-width="1.5" stroke-linejoin="round">
    <rect x="6" y="3" width="28" height="4.5" rx="2.25"/>
    <path d="M8.5 7.5 H31.5 V36.5 L20 29.5 L8.5 36.5 Z"/>
  </g>
  <!-- Ombrage (noir semi-transparent, intégré dans la forme du tissu) -->
  <path d="M26 8 H31 V35.4 L26 32.4 Z" fill="#000" fill-opacity="0.16"/>
  <path d="M20 29.5 L31 36 H9 Z" fill="#000" fill-opacity="0.10"/>
</svg>